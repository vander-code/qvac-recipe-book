<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Book</title>
<style>
  :root { --ink: #2b1d16; --muted: #7a6a60; --red: #d7263d; --card: #fff; --line: #ead9d3; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 16px/1.55 system-ui, "Segoe UI", sans-serif; background-color: #fff;
    background-image: linear-gradient(rgba(215,38,61,.10) 50%, transparent 50%), linear-gradient(90deg, rgba(215,38,61,.10) 50%, transparent 50%); background-size: 44px 44px; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font: 800 34px/1.1 Georgia, serif; margin: 0; color: var(--red); } .sub { margin: 2px 0 10px; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); margin: 0 0 4px; } #status.ok { color: #1c7a4a; } #status.err { color: var(--red); }
  #note { font-size: 13px; color: var(--red); min-height: 20px; margin: 0 0 8px; }
  .card { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  .card.click { cursor: pointer; } .card.click:hover { border-color: var(--red); }
  .card h3 { margin: 0; font: 700 20px Georgia, serif; } .meta { color: var(--muted); font-size: 14px; }
  input, textarea { width: 100%; font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 10px; color: var(--ink); background: #fff; }
  textarea { min-height: 130px; resize: vertical; }
  label { font-weight: 700; display: block; margin: 12px 0 4px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 9px 16px; border: 2px solid var(--ink); border-radius: 10px; background: var(--red); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); } button.spk { padding: 2px 10px; background: #fff; color: var(--ink); font-size: 18px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; } .row input { flex: 1; min-width: 0; } .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  ul.ing { list-style: none; padding: 0; margin: 6px 0; } ul.ing li { padding: 4px 0; } ul.ing input { width: auto; margin-right: 8px; accent-color: var(--red); }
  ul.ing li.done span { text-decoration: line-through; color: var(--muted); }
  ol.steps { padding-left: 0; list-style: none; counter-reset: s; margin: 6px 0; }
  ol.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  ol.steps li::before { content: counter(s); background: var(--ink); color: #fff; border-radius: 50%; min-width: 26px; height: 26px; text-align: center; font-weight: 700; font-size: 14px; line-height: 26px; }
  ol.steps li span { flex: 1; }
  h2 { font: 700 24px Georgia, serif; margin: 0 0 2px; } h4 { margin: 14px 0 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  #cookStep { font: 700 30px/1.35 Georgia, serif; margin: 16px 0; min-height: 120px; } #cookCount { color: var(--muted); font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 22px 0; } .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Recipe Book</h1>
  <p class="sub">Save your recipes. Have the steps read aloud while your hands are busy.</p>
  <p id="status">Checking the voice model...</p>
  <p id="note" aria-live="polite"></p>

  <!-- LIST -->
  <section id="listView">
    <div class="row"><input id="search" type="search" placeholder="Search recipes or ingredients..." aria-label="Search"><button id="newBtn">+ New</button></div>
    <div id="cards" style="margin-top:14px"></div>
    <div class="bar"><button class="ghost" id="sampleBtn">Add a sample recipe</button><button class="ghost" id="exportBtn">Download backup</button></div>
  </section>

  <!-- FORM -->
  <section id="formView" class="hidden card">
    <h2 id="formTitle">New recipe</h2>
    <label for="fTitle">Name</label><input id="fTitle" placeholder="Chicken adobo">
    <label for="fServ">Servings</label><input id="fServ" type="number" min="1" placeholder="4">
    <label for="fIng">Ingredients (one per line)</label><textarea id="fIng" placeholder="1 kg chicken&#10;1/2 cup soy sauce"></textarea>
    <label for="fSteps">Instructions (one step per line)</label><textarea id="fSteps" placeholder="Marinate the chicken for 30 minutes.&#10;Simmer until tender."></textarea>
    <div class="bar"><button id="saveBtn">Save recipe</button><button class="ghost" id="cancelBtn">Cancel</button></div>
  </section>

  <!-- DETAIL -->
  <section id="detailView" class="hidden card">
    <div class="bar" style="margin-top:0"><button class="ghost" id="backBtn">&larr; All recipes</button></div>
    <h2 id="dTitle"></h2><div class="meta" id="dMeta"></div>
    <div class="bar"><button id="cookBtn">Cooking mode</button><button class="ghost" id="editBtn">Edit</button><button class="ghost" id="delBtn">Delete</button></div>
    <h4>Ingredients <span id="ingSpeak"></span></h4><ul class="ing" id="dIng"></ul>
    <h4>Instructions</h4><ol class="steps" id="dSteps"></ol>
  </section>

  <!-- COOKING MODE -->
  <section id="cookView" class="hidden card">
    <div class="meta" id="cookName"></div><div id="cookCount"></div>
    <div id="cookStep" aria-live="polite"></div>
    <div class="bar"><button class="ghost" id="prevBtn">&larr; Back</button><button id="nextBtn">Next &rarr;</button><button class="ghost spk" id="cookSpeak" aria-label="Read aloud" disabled>🔊 Read aloud</button></div>
    <label style="font-weight:400"><input id="auto" type="checkbox" style="width:auto;accent-color:#d7263d"> Read each step automatically</label>
    <div class="bar"><button class="ghost" id="exitBtn">Exit cooking mode</button></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let recipes = [];
try { recipes = JSON.parse(localStorage.getItem("recipes") || "[]"); } catch {}
const persist = () => { try { localStorage.setItem("recipes", JSON.stringify(recipes)); } catch {} };
let ready = false, current = null, editingId = null, idx = 0;

function show(name) {
  ["listView", "formView", "detailView", "cookView"].forEach((v) => $(v).classList.toggle("hidden", v !== name));
  player.pause(); $("note").textContent = ""; window.scrollTo(0, 0);
}
const lines = (t) => t.split("\n").map((s) => s.replace(/^\s*(\d+[.)]|[-*\u2022])\s*/, "").trim()).filter(Boolean);

// ---------- Voice: text -> QVAC on your machine -> audio ----------
const player = new Audio(), cache = new Map();
async function fetchAudio(text) {
  if (cache.has(text)) return cache.get(text);
  const res = await fetch("/api/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
  if (!res.ok) throw new Error("speech failed");
  const url = URL.createObjectURL(await res.blob()); cache.set(text, url); return url;
}
async function speak(text) {
  player.pause(); $("note").textContent = "Preparing voice...";
  try { player.src = await fetchAudio(text); await player.play(); $("note").textContent = ""; }
  catch { $("note").textContent = "Couldn't read that aloud. Try again."; }
}
const prefetch = (text) => { if (text && !cache.has(text)) fetchAudio(text).catch(() => {}); };
function speakBtn(getText) {
  const b = document.createElement("button"); b.className = "spk"; b.textContent = "🔊"; b.setAttribute("aria-label", "Read aloud"); b.disabled = !ready;
  b.onclick = () => speak(getText()); return b;
}

// ---------- List ----------
function renderList() {
  const q = $("search").value.trim().toLowerCase(), box = $("cards"); box.innerHTML = "";
  const shown = recipes.filter((r) => !q || (r.title + " " + r.ingredients.join(" ")).toLowerCase().includes(q));
  if (!shown.length) { box.innerHTML = '<p class="empty">' + (recipes.length ? "No matches." : "No recipes yet. Add one, or try the sample!") + "</p>"; return; }
  shown.forEach((r) => {
    const c = document.createElement("div"); c.className = "card click"; c.tabIndex = 0;
    c.innerHTML = "<h3></h3><div class='meta'></div>"; c.querySelector("h3").textContent = r.title;
    c.querySelector(".meta").textContent = r.ingredients.length + " ingredients, " + r.steps.length + " steps" + (r.servings ? ", serves " + r.servings : "");
    c.onclick = () => openRecipe(r); c.onkeydown = (e) => { if (e.key === "Enter") openRecipe(r); };
    box.append(c);
  });
}
$("search").oninput = renderList;
$("newBtn").onclick = () => openForm(null);

// ---------- Form ----------
function openForm(r) {
  editingId = r ? r.id : null; $("formTitle").textContent = r ? "Edit recipe" : "New recipe";
  $("fTitle").value = r ? r.title : ""; $("fServ").value = r ? r.servings : ""; $("fIng").value = r ? r.ingredients.join("\n") : ""; $("fSteps").value = r ? r.steps.join("\n") : "";
  show("formView"); $("fTitle").focus();
}
$("saveBtn").onclick = () => {
  const title = $("fTitle").value.trim(); if (!title) return $("fTitle").focus();
  const data = { title, servings: $("fServ").value, ingredients: lines($("fIng").value), steps: lines($("fSteps").value) };
  if (editingId) { current = Object.assign(recipes.find((x) => x.id === editingId), data); } else { current = { id: Date.now(), ...data }; recipes.push(current); }
  persist(); openRecipe(current);
};
$("cancelBtn").onclick = () => (current && editingId ? openRecipe(current) : goList());
function goList() { renderList(); show("listView"); }

// ---------- Detail ----------
function openRecipe(r) {
  current = r; $("dTitle").textContent = r.title; $("dMeta").textContent = r.servings ? "Serves " + r.servings : "";
  $("ingSpeak").replaceChildren(speakBtn(() => "Ingredients. " + r.ingredients.join(". ")));
  const ing = $("dIng"); ing.innerHTML = "";
  r.ingredients.forEach((t) => { const li = document.createElement("li"), cb = document.createElement("input"), sp = document.createElement("span");
    cb.type = "checkbox"; cb.onchange = () => li.classList.toggle("done", cb.checked); sp.textContent = t; li.append(cb, sp); ing.append(li); });
  const st = $("dSteps"); st.innerHTML = "";
  r.steps.forEach((t) => { const li = document.createElement("li"), sp = document.createElement("span"); sp.textContent = t; li.append(sp, speakBtn(() => t)); st.append(li); });
  show("detailView");
}
$("backBtn").onclick = goList; $("editBtn").onclick = () => openForm(current);
$("delBtn").onclick = () => { if (confirm("Delete this recipe?")) { recipes = recipes.filter((x) => x !== current); persist(); goList(); } };

// ---------- Cooking mode ----------
function drawCook(autoSpeak) {
  const steps = current.steps; if (!steps.length) { $("cookStep").textContent = "This recipe has no steps yet."; return; }
  $("cookName").textContent = current.title; $("cookCount").textContent = "Step " + (idx + 1) + " of " + steps.length;
  $("cookStep").textContent = steps[idx]; $("prevBtn").disabled = idx === 0; $("nextBtn").disabled = idx === steps.length - 1;
  if (autoSpeak && ready) speak(steps[idx]);
  if (ready) prefetch(steps[idx + 1]);
}
$("cookBtn").onclick = () => { idx = 0; show("cookView"); drawCook($("auto").checked); };
$("prevBtn").onclick = () => { idx--; drawCook($("auto").checked); }; $("nextBtn").onclick = () => { idx++; drawCook($("auto").checked); };
$("cookSpeak").onclick = () => current.steps[idx] && speak(current.steps[idx]);
$("exitBtn").onclick = () => openRecipe(current);

// ---------- Extras ----------
$("sampleBtn").onclick = () => {
  recipes.push({ id: Date.now(), title: "Chicken Adobo", servings: "4",
    ingredients: ["1 kg chicken pieces", "1/2 cup soy sauce", "1/3 cup vinegar", "1 head garlic, crushed", "3 bay leaves", "1 teaspoon whole peppercorns", "1 cup water", "2 tablespoons cooking oil"],
    steps: ["Mix the chicken, soy sauce, vinegar, garlic, bay leaves and peppercorns in a pot. Let it marinate for 30 minutes.",
      "Add the water and bring to a boil. Lower the heat and simmer, covered, for 30 minutes.",
      "Take the chicken out and fry it in the oil until golden brown on all sides.",
      "Put the chicken back in the pot and simmer the sauce until it thickens, about 10 minutes.",
      "Serve hot over steamed rice."] });
  persist(); renderList();
};
$("exportBtn").onclick = () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(recipes, null, 2)], { type: "application/json" }));
  a.download = "my-recipes.json"; a.click();
};

// ---------- Voice model status ----------
async function checkStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    if (s.error) return setStatus("Voice error: " + s.error + ". Recipes still work.", "err");
    if (s.ready) { ready = true; document.querySelectorAll(".spk").forEach((b) => (b.disabled = false)); return setStatus("Voice ready. It runs on your device.", "ok"); }
    setStatus(s.message + (s.percent != null ? " " + s.percent + "%" : "") + " Recipes work meanwhile.");
  } catch { setStatus("Can't reach the server. Is it running?", "err"); }
  setTimeout(checkStatus, 2000);
}
function setStatus(t, c = "") { $("status").textContent = t; $("status").className = c; }

renderList(); checkStatus();
</script>
</body>
</html>
